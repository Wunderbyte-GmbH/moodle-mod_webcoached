<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMid meet">
  <!--
    mod_webcoached monologo
    Two interlocking rings inspired by the webcoachedtraining.de brand mark.
    Uses fill-rule="evenodd" so inner circles subtract from outer ones,
    creating two donut rings. Monocolor #212529 for Moodle CSS tinting.
    Canvas: 24x24 following Moodle 4.x core activity icon convention.

    Left ring:  center (8.5, 12), outer r=5.5, inner r=3.5
    Right ring: center (15.5, 12), outer r=5.5, inner r=3.5
    Overlap at x=10, creating interlocked look via even-odd fill.
  -->
  <path fill-rule="evenodd" clip-rule="evenodd"
    d="M3 12 A5.5 5.5 0 1 1 14 12 A5.5 5.5 0 1 1 3 12Z
       M5 12 A3.5 3.5 0 1 0 12 12 A3.5 3.5 0 1 0 5 12Z
       M10 12 A5.5 5.5 0 1 1 21 12 A5.5 5.5 0 1 1 10 12Z
       M12 12 A3.5 3.5 0 1 0 19 12 A3.5 3.5 0 1 0 12 12Z"
    fill="#212529"/>
</svg>
